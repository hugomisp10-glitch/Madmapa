$('x').onclick=()=>$('sh').classList.remove('o');map.on('click',()=>$('sh').classList.remove('o'));
// chips
const J=[['fun','Funchal'],['pm','Porto Moniz'],['san','Santana'],['mac','Machico'],['ar','Pico do Arieiro'],['cal','Calheta'],['cl','Câmara de Lobos'],['psl','São Lourenço'],['ps_v','Porto Santo']];
$('ch').innerHTML=J.map(j=>`<button class="ch" data-j="${j[0]}">🔎 ${j[1]}</button>`).join('')+'<button class="ch" id="cm">🌿 Só natureza</button>';
$('ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='cm'){NO=!NO;b.classList.toggle('on',!!NO);vis();return}const a=byId[b.dataset.j];map.flyTo({center:[a.lon,a.lat],zoom:a.id=='ps_v'?13.2:14,pitch:64,bearing:map.getBearing()+30,duration:2800})};
// pesquisa
const q=$('q'),r=$('res');q.oninput=()=>{const v=q.value.trim().toLowerCase();if(v.length<2){r.style.display='none';return}const m=ALL.filter(a=>a.n.toLowerCase().includes(v)).slice(0,8);r.innerHTML=m.map(a=>`<div data-i="${ALL.indexOf(a)}">${a.em} ${a.n} <small>${a.tp}</small></div>`).join('')||'<div>Sem resultados</div>';r.style.display='block'};
r.onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;r.style.display='none';q.value='';q.blur();show(ALL[d.dataset.i],1)};
// ferramentas
$('b3').onclick=e=>{const on=map.getPitch()<10;map.easeTo({pitch:on?62:0,bearing:on?map.getBearing():0,duration:900});e.currentTarget.classList.toggle('on',on)};
$('bo').onclick=e=>{orb=!orb;e.currentTarget.classList.toggle('on',!!orb);const f=()=>{if(!orb)return;map.setBearing(map.getBearing()+.12);requestAnimationFrame(f)};if(orb)f()};
map.on('dragstart',()=>{orb=0;$('bo').classList.remove('on')});
$('bs').onclick=()=>{si=(si+1)%3;map.setStyle(STY[si])};
// trajetos + marcador animado
let sa=null,raf=0;
function bus(c,emoji){cancelAnimationFrame(raf);if(!c.length)return;if(!sa){const e=document.createElement('div');e.className='bus';sa=new maplibregl.Marker({element:e}).setLngLat(c[0]).addTo(map)}sa.getElement().textContent=emoji;
 const n=c.length-1,dur=4500*n,t0=performance.now();const f=t=>{const u=((t-t0)%dur)/dur*n,i=Math.min(n-1,Math.floor(u)),k=u-i;sa.setLngLat([c[i][0]+(c[i+1][0]-c[i][0])*k,c[i][1]+(c[i+1][1]-c[i][1])*k]);raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function route(i){const t=TJ[i];HL=t[3];paintHL();let c=[];t[3].forEach(li=>c=c.concat(L[li][2].map(id=>[byId[id].lon,byId[id].lat])));
 const b=c.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(c[0],c[0]));map.fitBounds(b,{padding:{top:60,bottom:260,left:50,right:60},pitch:45,duration:1800,maxZoom:12.5});bus(c,L[t[3][0]][0]=='sea'?'⛴️':'🚌');
 $('shc').innerHTML=`<h2>🧭 ${t[0]}</h2><span class="tag">${t[1]}</span><p>${t[2]}</p><p style="font-size:12px;color:#677">Confirma sempre linhas e horários nos operadores locais.</p><button class="b" onclick="lista()">← Todos os trajetos</button>`}
function lista(){HL=[];paintHL();cancelAnimationFrame(raf);if(sa){sa.remove();sa=null}$('shc').innerHTML='<h2>🧭 Trajetos</h2>'+TJ.map((t,i)=>`<div class="tj" onclick="route(${i})"><b>${t[0]}</b><br><small>${t[1]}</small></div>`).join('');$('sh').classList.add('o')}
$('bt').onclick=lista;
</script></body></html>
